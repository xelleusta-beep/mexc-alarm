name: MEXC Alarm Kontrol

on:
  schedule:
    # GUN KAPANISI (00:00 UTC = 03:00 TR) -> 00:01-00:12 arasi HER DK
    - cron: "1-12 0 * * *"
    # Geri kalan sure: her 15 dk
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram test mesaji gonder"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  check-alarms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Repo'yu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Telegram test
        if: inputs.test == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "SECRET YOK"
            exit 1
          fi
          NOW=$(date -u +"%d.%m.%Y %H:%M UTC")
          MSG="✅ *TEST BASARILI*%0A━━━━━━━━━━━━━━━%0A🤖 GitHub Actions calisiyor%0A📅 ${NOW}%0AKaldirac: 10x | 15 coin | 1G"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MSG}\", \"parse_mode\": \"Markdown\"}"
          echo ""

      - name: Bagliliklari kur
        if: inputs.test != 'true'
        run: |
          pip install pandas numpy scikit-learn ccxt requests

      - name: Alarm kontrolu calistir
        if: inputs.test != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alarms_daemon.py --once

      - name: Konfig guncellemesini kaydet
        if: inputs.test != 'true'
        run: |
          git config user.name "alarm-bot"
          git config user.email "alarm-bot@users.noreply.github.com"
          git add alarm_config.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Alarm durumu guncellendi [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then
                echo "Push basarili"
                break
              fi
              echo "Push basarisiz, yeniden deneniyor ($i/5)..."
              sleep $((i * 2))
            done
          fi
